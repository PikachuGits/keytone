name: Release

# 推一个 v 开头的标签就会自动打包并发布，例如：
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS 通用包
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust（含双架构目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 前端是 dist/ 下的静态页，已经在仓库里，不需要构建。
      # 这里装的是 Tauri CLI（package.json 里的 devDependency）。
      - name: 安装 Tauri CLI
        run: npm install

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KeyTone ${{ github.ref_name }}
          releaseBody: |
            macOS 通用二进制，Apple Silicon 与 Intel 通用。

            **首次打开被系统拦下时**，右键点图标选「打开」，或执行：

            ```sh
            xattr -dr com.apple.quarantine /Applications/KeyTone.app
            ```

            应用未做代码签名与公证，这是正常的绕过方式。

            使用前需要在「系统设置 → 隐私与安全性 → 辅助功能」里勾选 KeyTone，
            否则无法捕获全局按键。
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
