name: Release

# 推一个 v 开头的标签就会自动打包并发布，例如：
#   git tag v0.1.4 && git push origin v0.1.4
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS 通用包
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust（含双架构目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 前端是 dist/ 下的静态页，已经在仓库里，不需要构建。
      # 这里装的是 Tauri CLI（package.json 里的 devDependency）。
      - name: 安装 Tauri CLI
        run: npm install

      # tauri.conf.json 里配了 bundle.macOS.signingIdentity = "-"，
      # 让 Tauri 打包时对整个 .app 做 ad-hoc 签名。
      # 不签的话 TCC 无法把辅助功能授权绑定到 app，
      # 用户会遇到「勾选了却一直显示未授权」。
      - name: 构建通用包
        run: npm run tauri build -- --target universal-apple-darwin

      - name: 校验签名（未签名直接失败，不发布）
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/KeyTone.app"
          echo "--- codesign --verify ---"
          codesign --verify --verbose=2 "$APP"
          echo "--- 签名详情 ---"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "Identifier=com.keytone.app" /tmp/sig.txt \
            || { echo "::error::签名标识符不是 com.keytone.app"; exit 1; }
          echo "签名校验通过"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: KeyTone ${{ github.ref_name }}
          draft: false
          body: |
            macOS 通用二进制，Apple Silicon 与 Intel 通用。

            **首次打开被系统拦下时**，右键点图标选「打开」，或执行：

            ```sh
            xattr -dr com.apple.quarantine /Applications/KeyTone.app
            ```

            应用已做 ad-hoc 签名但未做公证，Gatekeeper 仍会提示一次，这是正常的。

            **授权步骤**：启动后点开关 → 系统弹出提示 → 前往
            「系统设置 → 隐私与安全性 → 辅助功能」勾选 KeyTone → 回到应用再点一次开关。

            若勾选后仍显示未授权，把列表里的 KeyTone 用「−」删掉再重新添加一次。
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: macos

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Tauri CLI
        run: npm install

      # Windows 不需要签名，也不涉及辅助功能授权：
      # 低级键盘钩子装好就能用。
      - name: 构建安装包
        run: npm run tauri build

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
