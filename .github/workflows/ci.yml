name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 运行测试
        working-directory: src-tauri
        run: cargo test --verbose

      - name: 构建
        working-directory: src-tauri
        run: cargo build --verbose
